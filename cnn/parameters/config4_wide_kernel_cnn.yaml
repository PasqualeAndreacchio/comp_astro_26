# ==============================================================================
# Configuration 4: Wide-Kernel CNN (k=5, Dense 256-128, lr=3e-4)
# ==============================================================================

data:
  csv_path: "tess_data.csv"
  n_bins: 1000
  samples_per_class: 350
  standardize: true
  random_state: 42

model:
  name: "Config 4: Wide-Kernel CNN (k=5, Dense 256-128, lr=3e-4)"
  conv_channels: [64, 128, 256]
  kernel_sizes: [5, 5, 5]
  conv_dropouts: [0.25, 0.25, 0.35]
  pool_size: 2
  use_batchnorm: true
  use_global_avg_pool: true
  dense_dims: [256, 128]
  dense_dropouts: [0.2, 0.2]
  activation: "relu"
  l2_reg: 0.001

training:
  loss_type: "focal"
  focal_gamma: 2.5
  focal_alpha: 0.75
  learning_rate: 0.0003
  batch_size: 32
  epochs: 120
  min_epochs: 20
  val_split: 0.20
  patience: 25
  lr_patience: 8
  lr_factor: 0.5
  min_lr: 1.0e-7
  random_state: 42

output:
  report_path: "cnn/results/report_config4_wide_kernel_cnn.txt"
