# ==============================================================================
# Configuration 2: Regularized Medium Tree (max_depth=10, min_samples_leaf=10)
# ==============================================================================

data:
  csv_path: "tess_data.csv"
  n_bins: 1000
  samples_per_class: 350

model:
  name: "Config 2: Regularized Medium Tree (depth=10, leaf=10)"
  standardize: false
  criterion: "gini"
  max_depth: 10
  min_samples_split: 2
  min_samples_leaf: 10
  max_features: null
  ccp_alpha: 0.0
  random_state: 42

output:
  report_path: "decision_tree/results/report_config2_regularized_medium.txt"
