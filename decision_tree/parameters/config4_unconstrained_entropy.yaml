# ==============================================================================
# Configuration 4: Unconstrained Entropy Tree (depth=None, min_samples_leaf=5)
# ==============================================================================

data:
  csv_path: "tess_data.csv"
  n_bins: 1000
  samples_per_class: 350

model:
  name: "Config 4: Entropy Tree (depth=None, leaf=5)"
  standardize: false
  criterion: "entropy"
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 5
  max_features: null
  ccp_alpha: 0.0
  random_state: 42

output:
  report_path: "decision_tree/results/report_config4_unconstrained_entropy.txt"
