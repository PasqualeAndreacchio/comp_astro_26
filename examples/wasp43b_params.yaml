transit:
  t0: 0.0 # time of inferior conjunction
  per: 0.81347753 # orbital period in days
  rp: 0.15949 # planet radius (in units of stellar radii)
  a: 4.872 # semi-major axis (in units of stellar radii)
  inc: 82.33 # orbital inclination (in degrees)
  ecc: 0.0 # eccentricity
  w: 0.0 # longitude of periastron (in degrees)
  u: [0.36, 0.22] # limb darkening coefficients [u1, u2]
  limb_dark: "quadratic" # limb darkening model
classifier:
  type: cnn # [cnn, rf] for Convolutional Neural Network and Random Forest
